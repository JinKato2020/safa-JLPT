<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>メール確認完了 — まいにちJLPT</title>
<style>
  :root{
    --bg:#f6f4ee; --card:#ffffff; --ink:#2b2b2b; --sub:#8a8276;
    --line:#e7e2d6; --ok:#2e9c6b;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1b1a18; --card:#26241f; --ink:#efece4; --sub:#a89f90;
           --line:#3a372f; --ok:#5fd39b; }
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
    background:var(--bg); color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    padding:24px; min-height:100dvh; line-height:1.7;
  }
  .card{
    width:100%; max-width:360px; background:var(--card);
    border:1px solid var(--line); border-radius:18px;
    padding:40px 28px 32px; text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.06);
  }
  .check{ width:64px; height:64px; margin:0 auto 22px; display:block; }
  .check circle{
    fill:none; stroke:var(--ok); stroke-width:3; opacity:.25;
  }
  .check path{
    fill:none; stroke:var(--ok); stroke-width:4; stroke-linecap:round; stroke-linejoin:round;
    stroke-dasharray:34; stroke-dashoffset:34;
    animation:draw .5s .15s cubic-bezier(.65,0,.45,1) forwards;
  }
  @keyframes draw{ to{ stroke-dashoffset:0; } }
  @media (prefers-reduced-motion:reduce){ .check path{ animation:none; stroke-dashoffset:0; } }
  h1{ font-size:19px; font-weight:700; margin:0 0 8px; letter-spacing:.01em; }
  p{ margin:0; color:var(--sub); font-size:14px; }
  .hr{ height:1px; background:var(--line); margin:22px 0 14px; border:0; }
  .en{ font-size:12px; color:var(--sub); }
</style>
</head>
<body>
  <main class="card">
    <svg class="check" viewBox="0 0 52 52" aria-hidden="true">
      <circle cx="26" cy="26" r="24" />
      <path d="M16 27 l7 7 l14 -16" />
    </svg>
    <h1>メール確認が完了しました</h1>
    <p>アプリに戻ってログインしてください。<br>この画面は閉じて大丈夫です。</p>
    <hr class="hr" />
    <p class="en">Email confirmed. Please return to the まいにちJLPT app to sign in.</p>
  </main>
</body>
</html>
