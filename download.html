<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>まいにちJLPT ダウンロード</title>
<!-- 端末で自動振り分け: iPhone/iPad→App Store, Android→Google Play, PC等→選択ボタン。
     1つのURL (…/safa-JLPT/download.html) を配ればよい。両ストア共通の「魔法URL」は無いので、この中継ページが振り分ける。 -->
<style>
  :root{
    --bg:#f6efe3; --card:#fffdf7; --ink:#3a3128; --sub:#8a7d6b;
    --line:#e6dcc8; --accent:#b4472e; --accent-ink:#fff;
    --ios:#1a1a1a; --android:#01875f;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#211d18; --card:#2b261f; --ink:#f2e9da; --sub:#b7a992;
      --line:#3d372c; --accent:#e0765c;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",Segoe UI,Roboto,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
    -webkit-text-size-adjust:100%;
  }
  .card{
    width:100%; max-width:420px; background:var(--card);
    border:1px solid var(--line); border-radius:20px;
    padding:32px 24px; text-align:center;
    box-shadow:0 8px 28px rgba(0,0,0,.08);
  }
  h1{font-size:1.4rem; margin:0 0 4px; letter-spacing:.02em}
  .lead{color:var(--sub); font-size:.95rem; margin:0 0 24px; line-height:1.6}
  .btns{display:flex; flex-direction:column; gap:12px}
  a.store{
    display:flex; align-items:center; justify-content:center; gap:10px;
    text-decoration:none; font-weight:700; font-size:1.05rem;
    padding:15px 18px; border-radius:14px; color:#fff;
  }
  a.ios{background:var(--ios)}
  a.android{background:var(--android)}
  .redir{color:var(--sub); font-size:.85rem; margin-top:20px; min-height:1.2em}
  .redir a{color:var(--accent)}
  svg{width:22px;height:22px;flex:0 0 auto}
</style>
</head>
<body>
  <main class="card">
    <h1>まいにちJLPT</h1>
    <p class="lead" id="lead">お使いの端末のストアへご案内します。</p>
    <div class="btns">
      <a class="store ios" id="ios" href="https://apps.apple.com/jp/app/id6782896670">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.365 1.43c0 1.14-.417 2.2-1.11 2.98-.74.83-1.94 1.47-3.1 1.38-.14-1.11.42-2.28 1.1-3.02.75-.82 2.05-1.42 3.11-1.34zM20.5 17.2c-.6 1.38-.88 1.99-1.65 3.2-1.08 1.68-2.6 3.77-4.48 3.79-1.67.02-2.1-1.08-4.36-1.07-2.26.01-2.73 1.09-4.4 1.07-1.88-.02-3.32-1.91-4.4-3.59C-.9 17.2-.34 11.6 2.67 9.5c1.03-.72 2.28-1.12 3.5-1.12 1.28 0 2.09.7 3.15.7 1.03 0 1.66-.7 3.14-.7 1.09 0 2.25.6 3.08 1.63-2.71 1.48-2.27 5.34.96 6.49z"/></svg>
        App Store（iPhone / iPad）
      </a>
      <a class="store android" id="android" href="https://play.google.com/store/apps/details?id=com.safa.english">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.6 1.3l11.7 11.7-2.5 2.5L3 4.2c-.2-.4-.3-.8-.3-1.2 0-.6.3-1.2.9-1.7zM14.9 8.5l2.8 1.6c.9.5 1.4 1.2 1.4 2s-.5 1.5-1.4 2l-2.8 1.6-2.7-2.6 2.7-2.6zm-2.6 2.6L1.9 21.3c.4.3.9.5 1.5.5.4 0 .8-.1 1.2-.3l10.9-6.3-3.2-3.1z"/></svg>
        Google Play（Android）
      </a>
    </div>
    <p class="redir" id="redir"></p>
  </main>
<script>
(function(){
  var IOS = "https://apps.apple.com/jp/app/id6782896670";
  var AND = "https://play.google.com/store/apps/details?id=com.safa.english";
  var ua = navigator.userAgent || "";
  var isAndroid = /android/i.test(ua);
  // iPadOS 13+ は Mac を名乗るのでタッチ有無で補正
  var isIOS = /iphone|ipad|ipod/i.test(ua) ||
              (/macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
  var target = isIOS ? IOS : (isAndroid ? AND : null);
  var lead = document.getElementById("lead");
  var redir = document.getElementById("redir");
  if (target) {
    lead.textContent = "ストアへ移動しています…";
    redir.innerHTML = 'うまく開かない場合は <a href="'+target+'">こちらをタップ</a>';
    // 即リダイレクト（履歴を汚さない）
    location.replace(target);
  } else {
    lead.textContent = "お使いの端末にあわせて選んでください。";
  }
})();
</script>
</body>
</html>
