<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>まいにちJLPT 教師専用サイト</title>
<style>
  :root{
    --bg:#f6f5f1; --card:#fff; --ink:#2b2b2b; --sub:#7a756c; --line:#e6e2d8;
    --accent:#c8483a; --accent2:#3a7bc8; --good:#2e9c6b; --warn:#d98a1f; --bad:#c8483a; --chip:#f0ede6;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1b1a18; --card:#26241f; --ink:#efece4; --sub:#a89f90; --line:#3a372f; --chip:#2f2c26; }
  }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system,"Hiragino Kaku Gothic ProN","Meiryo",system-ui,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.6; }
  header{ padding:16px 20px; border-bottom:1px solid var(--line); background:var(--card);
    display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  h1{ font-size:18px; margin:0; }
  .muted{ color:var(--sub); font-size:13px; }
  main{ max-width:1500px; margin:0 auto; padding:18px 16px 60px; }
  input,select{ padding:9px 11px; border:1px solid var(--line); border-radius:8px; background:var(--card);
    color:var(--ink); font-size:14px; }
  input{ min-width:240px; }
  button{ padding:9px 16px; border:0; border-radius:8px; background:var(--accent); color:#fff;
    font-size:14px; cursor:pointer; }
  button:disabled{ opacity:.45; cursor:not-allowed; }
  button.ghost{ background:transparent; color:var(--accent); border:1px solid var(--accent); }
  .login{ max-width:380px; margin:8vh auto 0; background:var(--card); border:1px solid var(--line);
    border-radius:14px; padding:26px 24px; }
  .login h2{ margin:0 0 4px; font-size:18px; }
  .login .row{ margin:14px 0; }
  .login input{ width:100%; }
  .err{ color:var(--bad); font-size:13px; white-space:pre-wrap; margin-top:10px; }
  .spacer{ flex:1; }
  .splash{ max-width:380px; margin:16vh auto 0; text-align:center; color:var(--sub); }
  .langsel{ font-size:13px; padding:6px 8px; }
  .manage{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin:4px 2px 16px; }
  .manage .top{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .manage .count{ font-weight:700; font-size:15px; }
  .manage .coderow{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:10px; }
  .manage .code{ font-weight:700; font-size:20px; letter-spacing:.14em; font-variant-numeric:tabular-nums;
    padding:4px 12px; border-radius:8px; background:var(--chip); border:1px solid var(--line); }
  .manage form{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px; }
  .manage .hint{ font-size:12px; color:var(--sub); margin-top:8px; white-space:pre-wrap; }
  .manage .msg{ font-size:13px; margin-top:8px; white-space:pre-wrap; }
  .scroll{ overflow-x:auto; background:var(--card); border:1px solid var(--line); border-radius:12px; }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th,td{ text-align:left; padding:7px 9px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th{ color:var(--sub); font-weight:600; font-size:12px; position:sticky; top:0; background:var(--card); }
  td.num,th.num{ text-align:right; font-variant-numeric:tabular-nums; }
  tr:hover td{ background:var(--bg); }
  .who{ font-weight:600; } .who .mail{ font-weight:400; color:var(--sub); font-size:11px; display:block; }
  .ok{ color:var(--good); } .mid{ color:var(--warn); } .low{ color:var(--bad); } .off{ color:var(--sub); opacity:.5; }
  .lv{ font-size:11px; padding:1px 8px; border-radius:99px; background:var(--chip); border:1px solid var(--line); }
  .pending{ font-size:11px; padding:1px 8px; border-radius:99px; background:var(--chip); border:1px dashed var(--line); color:var(--sub); }
  .empty{ color:var(--sub); padding:24px 8px; }
  .gsep{ border-left:1px solid var(--line); }
  .delx{ padding:3px 10px; border:1px solid var(--bad); border-radius:6px; background:transparent; color:var(--bad); cursor:pointer; font-size:12px; }
</style>
</head>
<body>

<div id="splashView" class="splash">…</div>

<div id="loginView" class="login" hidden>
  <div style="text-align:right;margin-bottom:6px"><select id="langSelLogin" class="langsel"></select></div>
  <h2 data-i18n="login_h2">教師専用サイト</h2>
  <div class="muted" data-i18n="login_sub">まいにちJLPT ／ 先生用ログイン</div>
  <div class="muted" style="margin-top:10px; font-size:12px">
    <span data-i18n="login_hint_app">ふだんは まいにちJLPTアプリ の「アカウント」→「教師サイトを開く」から入ると、ここで入力は不要です。</span><br>
    <span data-i18n="login_hint_browser">下はアプリを使わずブラウザだけで入る場合です。</span>
  </div>
  <button id="googleBtn" class="ghost" style="width:100%; margin-top:14px" data-i18n="btn_google">Googleでログイン（アプリと同じGoogle）</button>
  <div class="muted" style="text-align:center; margin:12px 0 2px" data-i18n="or_email">または メール＋パスワード</div>
  <div class="row"><input id="email" type="email" data-i18n-ph="ph_email" placeholder="メールアドレス" autocomplete="username"></div>
  <div class="row"><input id="pass" type="password" data-i18n-ph="ph_pass" placeholder="パスワード" autocomplete="current-password"></div>
  <button id="loginBtn" data-i18n="btn_login">ログイン</button>
  <button id="signupBtn" class="ghost" style="margin-top:10px; width:100%" data-i18n="btn_signup">新規登録（初めての先生）</button>
  <div id="loginErr" class="err"></div>
  <div class="muted" style="margin-top:14px; font-size:12px" data-i18n="login_foot">
    ※ アプリと同じメール／Googleでログインしてください。管理者がそのメールを「先生」として学校に登録すると、生徒を登録できるようになります。
  </div>
</div>

<div id="appView" hidden>
  <header>
    <h1 data-i18n="login_h2">教師専用サイト</h1>
    <span id="schoolName" class="muted"></span>
    <span class="spacer"></span>
    <select id="langSel" class="langsel"></select>
    <span id="meLabel" class="muted"></span>
    <button id="reloadBtn" class="ghost" data-i18n="btn_reload">更新</button>
    <button id="logoutBtn" class="ghost" data-i18n="btn_logout">ログアウト</button>
  </header>
  <main>
    <div id="notTeacher" class="empty" hidden></div>

    <div id="manage" class="manage" hidden>
      <div class="top">
        <span class="count"><span data-i18n="count_students">生徒</span> <span id="stuCount">0</span><span class="muted"> / <span id="stuCap">20</span><span data-i18n="count_people">人</span></span></span>
        <span class="spacer"></span>
      </div>
      <div class="coderow">
        <span class="muted" data-i18n="code_label">団体コード（生徒がアプリで入力）:</span>
        <span id="codeVal" class="code">—</span>
        <button id="copyCodeBtn" class="ghost" type="button" data-i18n="btn_copy">コピー</button>
        <button id="regenCodeBtn" class="ghost" type="button" data-i18n="btn_regen">作り直す</button>
      </div>
      <div class="hint" id="manageHint" data-i18n="manage_hint"></div>
      <form id="addForm">
        <input id="addEmail" type="email" data-i18n-ph="ph_add_email" placeholder="生徒のメールアドレス" autocomplete="off">
        <button id="addBtn" type="submit" data-i18n="btn_add">生徒をメールで追加</button>
      </form>
      <div id="manageMsg" class="msg"></div>
    </div>

    <div class="muted" id="summary" style="margin:6px 2px 12px"></div>
    <div class="scroll">
      <table id="tbl">
        <thead><tr>
          <th data-i18n="th_student">生徒</th><th data-i18n="th_level">レベル</th>
          <th class="num gsep" data-i18n="th_pred">予想得点</th><th class="num" data-i18n="th_pass">合格率</th>
          <th class="num gsep" data-i18n="th_kanji">漢字</th><th class="num" data-i18n="th_vocab">語彙</th><th class="num" data-i18n="th_grammar">文法</th>
          <th class="num gsep" data-i18n="th_acc_k">正答 漢</th><th class="num" data-i18n="th_acc_v">語</th><th class="num" data-i18n="th_acc_g">文</th><th class="num" data-i18n="th_acc_r">読</th><th class="num" data-i18n="th_acc_l">聴</th>
          <th class="num gsep" data-i18n="th_studytime">学習時間</th><th class="num" data-i18n="th_studydays">学習日</th><th class="num" data-i18n="th_streak">連続</th><th class="num" data-i18n="th_mock">模試</th>
          <th class="gsep" data-i18n="th_last">最終アクセス</th><th class="num" data-i18n="th_days">利用日数</th>
          <th class="gsep"></th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div id="emptyMsg" class="empty" hidden></div>
  </main>
</div>

/* I18N-END */

const LANG_CODES = ['ja','en','ne','bn','id','ko','my','th','vi','zh','zh2'];
const LANG_NAMES = { ja:'日本語', en:'English', ne:'नेपाली', bn:'বাংলা', id:'Indonesia', ko:'한국어', my:'မြန်မာ', th:'ไทย', vi:'Tiếng Việt', zh:'简体中文', zh2:'繁體中文' };
let LANG = 'ja';

function t(k, vars){
  let s = (I18N[LANG] && I18N[LANG][k]) || (I18N.ja && I18N.ja[k]) || k;
  if (vars) for (const p in vars) s = s.split('{'+p+'}').join(String(vars[p]));
  return s;
}
function pickLang(fromParam){
  if (fromParam && LANG_CODES.includes(fromParam)) return fromParam;
  try{
    const stored = localStorage.getItem('teacher_lang');
    if (stored && LANG_CODES.includes(stored)) return stored;
  }catch(_){}
  const n = (navigator.language || '').toLowerCase();
  if (n.startsWith('zh')) return (n.includes('tw') || n.includes('hk') || n.includes('hant')) ? 'zh2' : 'zh';
  const two = n.split('-')[0];
  return LANG_CODES.includes(two) ? two : 'ja';
}
function fillLangSelectors(){
  const opts = LANG_CODES.filter(c => I18N[c]).map(c => `<option value="${c}">${LANG_NAMES[c]||c}</option>`).join('');
  ['langSel','langSelLogin'].forEach(id => { const el = document.getElementById(id); if (el){ el.innerHTML = opts; el.value = LANG; } });
}
function applyLang(){
  document.documentElement.lang = (LANG === 'zh2') ? 'zh-Hant' : LANG;
  document.title = t('app_title');
  document.querySelectorAll('[data-i18n]').forEach(el => { const k = el.getAttribute('data-i18n'); if (I18N.ja[k] !== undefined || (I18N[LANG] && I18N[LANG][k] !== undefined)) el.textContent = t(k); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => el.setAttribute('placeholder', t(el.getAttribute('data-i18n-ph'))));
  ['langSel','langSelLogin'].forEach(id => { const el = document.getElementById(id); if (el) el.value = LANG; });
}
</script>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://nxovouiqelynryumjvyq.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_bfqPNA4Z83i87E99YLwUyQ_I5NFMC3v';
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = (id) => document.getElementById(id);
const splashView = $('splashView'), loginView = $('loginView'), appView = $('appView');
let homeInfo = null;

// 言語切替(load/appView を使うのでモジュール側に置く)。t/LANG/applyLang は先のクラシックscriptの共有グローバル。
function setLang(code, reload){
  LANG = LANG_CODES.includes(code) ? code : 'ja';
  try{ localStorage.setItem('teacher_lang', LANG); }catch(_){}
  applyLang();
  if (reload && !appView.hidden) load();
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function pct(v){
  if (v === null || v === undefined) return '<span class="off">—</span>';
  const n = Math.round(Number(v));
  const cls = n >= 70 ? 'ok' : n >= 40 ? 'mid' : 'low';
  return `<span class="${cls}">${n}</span>`;
}
function mins(m){
  if (!m) return '<span class="off">—</span>';
  const h = Math.floor(m/60), mm = m%60;
  return h ? `${h}h${mm ? mm+'m' : ''}` : `${mm}m`;
}
function cell(v){ return (v === null || v === undefined || v === '') ? '<span class="off">—</span>' : esc(v); }

function showSplash(){ splashView.hidden = false; loginView.hidden = true; appView.hidden = true; }
function showLogin(){ splashView.hidden = true; appView.hidden = true; loginView.hidden = false; }
async function showApp(){
  splashView.hidden = true; loginView.hidden = true; appView.hidden = false;
  const { data:{ user } } = await sb.auth.getUser();
  $('meLabel').textContent = user ? user.email : '';
  await load();
}

async function load(){
  $('rows').innerHTML = '';
  $('emptyMsg').hidden = true;
  try{
    const { data: home, error: he } = await sb.rpc('teacher_home');
    if (he) throw he;
    homeInfo = home || null;
  }catch(e){ homeInfo = null; }

  if (!homeInfo){
    $('manage').hidden = true;
    $('schoolName').textContent = '';
    $('summary').textContent = '';
    $('notTeacher').hidden = false;
    $('notTeacher').textContent = t('not_teacher');
    return;
  }
  $('notTeacher').hidden = true;
  $('schoolName').textContent = '／ ' + (homeInfo.school_name || '');
  $('manage').hidden = false;
  renderCount();

  if (!homeInfo.teacher_code){
    try{ const { data: code } = await sb.rpc('teacher_code'); if (code) homeInfo.teacher_code = code; }catch(_){}
  }
  renderCode();

  const { data, error } = await sb.from('v_teacher_students').select('*')
    .order('has_data', { ascending:false }).order('last_day', { ascending:false });
  if (error){ $('emptyMsg').hidden = false; $('emptyMsg').textContent = t('load_error', { msg: error.message }); return; }
  if (!data || data.length === 0){ $('summary').textContent = t('summary_none'); return; }
  const active = data.filter(r => r.last_day && (Date.now() - new Date(r.last_day).getTime()) < 7*864e5).length;
  const studying = data.filter(r => r.has_data).length;
  $('summary').textContent = t('summary_counts', { total: data.length, studying, active });
  $('rows').innerHTML = data.map(r => {
    const del = `<td class="gsep"><button class="delx" data-email="${esc(r.email)}">${t('btn_delete')}</button></td>`;
    if (!r.has_data){
      return `<tr>
        <td class="who"><span class="mail" style="font-size:13px">${esc(r.email)}</span></td>
        <td><span class="pending">${t('pending')}</span></td>
        <td class="num gsep off">—</td><td class="num off">—</td>
        <td class="num gsep off">—</td><td class="num off">—</td><td class="num off">—</td>
        <td class="num gsep off">—</td><td class="num off">—</td><td class="num off">—</td><td class="num off">—</td><td class="num off">—</td>
        <td class="num gsep off">—</td><td class="num off">—</td><td class="num off">—</td><td class="num off">—</td>
        <td class="gsep off">—</td><td class="num off">—</td>
        ${del}
      </tr>`;
    }
    return `<tr>
      <td class="who">${r.nickname ? esc(r.nickname) : ''}<span class="mail">${esc(r.email)}</span></td>
      <td><span class="lv">${cell(r.level)}</span></td>
      <td class="num gsep">${r.pred_score!=null ? r.pred_score : '<span class="off">—</span>'}</td>
      <td class="num">${pct(r.pass_pct)}</td>
      <td class="num gsep">${pct(r.cov_kanji)}</td><td class="num">${pct(r.cov_vocab)}</td><td class="num">${pct(r.cov_grammar)}</td>
      <td class="num gsep">${pct(r.acc_kanji)}</td><td class="num">${pct(r.acc_vocab)}</td><td class="num">${pct(r.acc_grammar)}</td><td class="num">${pct(r.acc_dokkai)}</td><td class="num">${pct(r.acc_choukai)}</td>
      <td class="num gsep">${mins(r.study_min)}</td><td class="num">${cell(r.study_days)}</td><td class="num">${cell(r.streak)}</td><td class="num">${cell(r.mock_count)}</td>
      <td class="gsep">${cell(r.last_day)}</td><td class="num">${cell(r.days)}</td>
      ${del}
    </tr>`;
  }).join('');
}

function renderCount(){
  if (!homeInfo) return;
  const n = homeInfo.student_count ?? 0, cap = homeInfo.student_cap ?? 20;
  $('stuCount').textContent = n;
  $('stuCap').textContent = cap;
  $('addBtn').disabled = n >= cap;
  $('addEmail').disabled = n >= cap;
  $('manageMsg').textContent = n >= cap ? t('cap_reached', { cap }) : '';
  $('manageMsg').style.color = n >= cap ? 'var(--warn)' : '';
}
function renderCode(){ $('codeVal').textContent = (homeInfo && homeInfo.teacher_code) ? homeInfo.teacher_code : '—'; }

$('copyCodeBtn').onclick = async () => {
  const code = homeInfo && homeInfo.teacher_code; if (!code) return;
  try{ await navigator.clipboard.writeText(code); const b=$('copyCodeBtn'); const o=b.textContent; b.textContent=t('copied'); setTimeout(()=>b.textContent=o, 1200); }catch(_){}
};
$('regenCodeBtn').onclick = async () => {
  if (!confirm(t('regen_confirm'))) return;
  try{ const { data: code, error } = await sb.rpc('teacher_code', { p_regenerate: true }); if (error) throw error;
    if (homeInfo) homeInfo.teacher_code = code; renderCode();
    $('manageMsg').style.color='var(--good)'; $('manageMsg').textContent=t('regen_ok');
  }catch(e){ $('manageMsg').style.color='var(--bad)'; $('manageMsg').textContent=t('regen_fail', { msg: (e.message||e) }); }
};

$('addForm').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const email = ($('addEmail').value || '').trim().toLowerCase();
  const msg = $('manageMsg');
  if (!email){ msg.style.color='var(--bad)'; msg.textContent=t('add_need_email'); return; }
  $('addBtn').disabled = true;
  try{
    const { data, error } = await sb.rpc('teacher_add_student', { p_email: email });
    if (error) throw error;
    $('addEmail').value = '';
    if (homeInfo) homeInfo.student_count = (data && data.count != null) ? data.count : (homeInfo.student_count+1);
    msg.style.color = 'var(--good)';
    msg.textContent = (data && data.duplicate) ? t('add_dup', { email }) : t('add_ok', { email });
    await load();
  }catch(e){
    msg.style.color = 'var(--bad)';
    msg.textContent = t('add_fail', { msg: (e.message || e) });
    renderCount();
  }
});
$('rows').addEventListener('click', async (ev) => {
  const btn = ev.target.closest('button.delx'); if (!btn) return;
  const email = btn.dataset.email;
  if (!confirm(t('remove_confirm', { email }))) return;
  const msg = $('manageMsg');
  try{
    const { data, error } = await sb.rpc('teacher_remove_student', { p_email: email });
    if (error) throw error;
    if (homeInfo && data && data.count != null) homeInfo.student_count = data.count;
    msg.style.color = 'var(--good)'; msg.textContent = t('remove_ok', { email });
    await load();
  }catch(e){ msg.style.color='var(--bad)'; msg.textContent = t('remove_fail', { msg: (e.message || e) }); }
});

function creds(){ return { email: $('email').value.trim(), password: $('pass').value }; }
function sayErr(m){ $('loginErr').style.color = ''; $('loginErr').textContent = m; }
function sayOk(m){ $('loginErr').style.color = 'var(--good)'; $('loginErr').textContent = m; }

$('loginBtn').onclick = async () => {
  sayErr('');
  const { email, password } = creds();
  if (!email || !password){ sayErr(t('login_need')); return; }
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error){ sayErr(t('login_fail', { msg: error.message })); return; }
};
$('signupBtn').onclick = async () => {
  sayErr('');
  const { email, password } = creds();
  if (!email || !password){ sayErr(t('login_need')); return; }
  if (password.length < 6){ sayErr(t('signup_shortpw')); return; }
  const redirect = new URL('confirm_for_teacher.html', window.location.href).href;
  const { data, error } = await sb.auth.signUp({ email, password, options: { emailRedirectTo: redirect } });
  if (error){ sayErr(t('signup_fail', { msg: error.message })); return; }
  if (!data.session){ sayOk(t('signup_sent')); }
};
$('googleBtn').onclick = async () => {
  sayErr('');
  const { error } = await sb.auth.signInWithOAuth({
    provider: 'google',
    options: {
      redirectTo: window.location.href.split('#')[0].split('?')[0],
      queryParams: { prompt: 'select_account' }   // 複数Googleアカウントの人が毎回選べる
    }
  });
  if (error){ sayErr(t('google_fail', { msg: error.message })); }
};
$('pass').addEventListener('keydown', e => { if (e.key === 'Enter') $('loginBtn').click(); });
$('reloadBtn').onclick = load;
$('logoutBtn').onclick = async () => { await sb.auth.signOut(); showLogin(); };
$('langSel').addEventListener('change', e => setLang(e.target.value, true));
$('langSelLogin').addEventListener('change', e => setLang(e.target.value, false));

// アプリからのログイン引き継ぎ(#t_at=...&t_rt=...&lang=xx)。lang があればその言語で開く。
async function consumeHandoff(){
  const h = window.location.hash || '';
  if (!h.includes('t_at=') && !h.includes('lang=')) return;
  const p = new URLSearchParams(h.replace(/^#/, ''));
  const lang = p.get('lang');
  if (lang) setLang(lang, false);
  const access_token = p.get('t_at'), refresh_token = p.get('t_rt');
  history.replaceState(null, '', window.location.pathname + window.location.search);
  if (access_token && refresh_token){
    try{ await sb.auth.setSession({ access_token, refresh_token }); }catch(_){}
  }
}

(async () => {
  LANG = pickLang(null);
  fillLangSelectors();
  applyLang();
  showSplash();
  try{ await consumeHandoff(); }catch(_){}
  const { data:{ session } } = await sb.auth.getSession();
  if (session) await showApp(); else showLogin();
  sb.auth.onAuthStateChange((_event, s) => { if (s) showApp(); else showLogin(); });
})();
</script>
</body>
