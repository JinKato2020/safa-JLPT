<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>まいにちJLPT — 町への招待</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    background: linear-gradient(160deg, #fbe9f1 0%, #eaf2fb 100%); color: #2a2430; padding: 24px;
  }
  @media (prefers-color-scheme: dark) {
    body { background: linear-gradient(160deg, #241a24 0%, #16202e 100%); color: #f0ecf2; }
    .card { background: #1d2432 !important; }
    .meta { color: #b9c2d6 !important; }
    .store { border-color: #39435a !important; color: #dfe6f5 !important; }
  }
  .card {
    width: 100%; max-width: 420px; background: #fff; border-radius: 22px; padding: 30px 24px 26px;
    box-shadow: 0 18px 50px rgba(60,40,80,.18); text-align: center;
  }
  .emoji { font-size: 58px; line-height: 1; margin-bottom: 6px; }
  h1 { font-size: 21px; font-weight: 800; margin: 8px 0 6px; line-height: 1.5; }
  .who { color: #e2588f; }
  .meta { color: #6a6472; font-size: 14px; line-height: 1.6; margin: 0 0 22px; }
  .cta {
    display: block; width: 100%; border: 0; cursor: pointer; text-decoration: none;
    background: #3f7bd6; color: #fff; font-size: 17px; font-weight: 800;
    padding: 15px; border-radius: 999px; margin-bottom: 10px;
  }
  .cta:active { opacity: .9; }
  .hint { font-size: 12.5px; color: #8a8494; margin: 16px 0 10px; }
  .stores { display: flex; gap: 10px; }
  .store {
    flex: 1; text-decoration: none; border: 1px solid #e2dbe8; border-radius: 12px;
    padding: 11px 8px; font-size: 13px; font-weight: 700; color: #4a4550;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="emoji">🏘️</div>
    <h1><span class="who" id="who">お友だち</span>が<br>「日本語学習者の町」に招待しています</h1>
    <p class="meta">参加すると、あなたが相手の町に住人としてあらわれます。<br>いっしょに毎日、日本語を学びましょう。</p>
    <a class="cta" id="open" href="#">アプリで開く</a>
    <p class="hint">アプリがまだない方は、入手してから開いてください。</p>
    <div class="stores">
      <!-- App Store の数値ID が確定したら差し替えてください(TestFlight中は未公開) -->
      <a class="store" id="ios" href="#">App Store</a>
      <a class="store" href="https://play.google.com/store/apps/details?id=com.safa.english">Google Play</a>
    </div>
  </div>
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var u = q.get('u') || '';
    var n = q.get('n') || '';
    if (n) { try { document.getElementById('who').textContent = decodeURIComponent(n) + 'さん'; } catch (e) {} }
    // 「アプリで開く」= カスタムスキームでアプリを起動(インストール済みなら開く)。
    var scheme = 'safajlpt://invite?u=' + encodeURIComponent(u);
    document.getElementById('open').setAttribute('href', scheme);
    // App Store は未確定のため、暫定でアプリ名検索に誘導(公開後に itms-apps の直URLへ差し替え)。
    document.getElementById('ios').setAttribute('href', 'https://apps.apple.com/jp/search?term=' + encodeURIComponent('まいにちJLPT'));
  })();
</script>
</body>
</html>
