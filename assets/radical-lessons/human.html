if(step===6){title=L('「やすむ」は、どれ？','Which word means “to rest”?');sub=L('最後は、色のヒントなしで選んでみましょう。','Try it without the color hint.');body=`<div class="stage"><div class="choices">${['何','休む','人'].map(c=>`<button class="choice ${solved.has(step)&&c==='休む'?'correct':''}" data-answer="${c==='休む'}" ${solved.has(step)?'disabled':''}>${c}</button>`).join('')}</div></div><button class="sound" data-say="やすむ">▷ ${t('listen')}</button>`;}
if(step===7){title=L('「人のなかま」を学びました','You learned the person family');sub=L('形を見つけて、漢字を一つずつ。','A familiar part can help you remember a new kanji.');body=`<div class="done-symbol" aria-hidden="true">✓</div><div class="result"><strong>${firstCorrect.size} / 4</strong><p>${L('最初の挑戦で正解した問題','Questions answered correctly on the first try')}</p></div><div class="stage" style="min-height:150px;padding:8px 0"><div>${glyph('休',{small:true,highlight:true})}<div class="caption">休む · やすむ</div></div><div>${glyph('何',{small:true,highlight:true})}<div class="caption">何 · なに</div></div></div><div class="note">${L('どちらにも、左側に「亻」があります。次にこの漢字を見かけたら、同じ形を探してみましょう。','Both kanji have 亻 on the left. Look for that familiar part the next time you see them.')}</div>`;}
